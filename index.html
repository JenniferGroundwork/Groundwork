    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://groundworkconsult.ca/#organization",
      "name": "Groundwork Consult",
      "url": "https://groundworkconsult.ca",
      "email": "jennifer@groundworkconsult.ca",
      "description": "Groundwork Consult helps founder-led small businesses in trades, wellness and health services, and other client-facing operations stop relying on memory and start running on documented systems. We build fixed-scope SOPs, role clarity, client journey and onboarding, and backend automation, each priced and contracted on its own.",
      "slogan": "Stop relying on memory. Start running on systems.",
      "areaServed": [
        { "@type": "Country", "name": "Canada" },
        { "@type": "Country", "name": "United States" },
        { "@type": "AdministrativeArea", "name": "Ontario" }
      ],
      "knowsAbout": [
        "Operations consulting",
        "Standard operating procedures",
        "Business process documentation",
        "Workflow optimization",
        "Founder-led business systems",
        "Trades business operations",
        "Wellness and health services operations",
        "Client journey and onboarding design",
        "Backend tooling and automation"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Groundwork Consult Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Systems Walkthrough",
              "description": "A free first step. One to a few sessions, depending on the size and complexity of the business, where we go through what's actually happening in the operation together. Ends with a short written list of what we'd build and why. Not a formal audit or a paid diagnostic.",
              "provider": { "@id": "https://groundworkconsult.ca/#organization" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "SOP & Handoff Build",
              "description": "Documents the core processes a client defines, written so someone other than the founder can run them. Team training and ongoing updates are scoped separately.",
              "provider": { "@id": "https://groundworkconsult.ca/#organization" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Job Description & Role Clarity Build",
              "description": "Written job descriptions for roles a client needs defined, built from how the role actually works. Hiring and onboarding are scoped separately.",
              "provider": { "@id": "https://groundworkconsult.ca/#organization" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Client Journey & Onboarding Build",
              "description": "Maps the full client journey from first contact to first invoice and builds onboarding inside the client's existing tools. New software purchases are scoped separately.",
              "provider": { "@id": "https://groundworkconsult.ca/#organization" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Backend & Automation Setup",
              "description": "Connects and automates the tools a client already has. Built around their current stack. Full migrations and new integrations are scoped separately.",
              "provider": { "@id": "https://groundworkconsult.ca/#organization" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Free Operational Self-Assessment",
              "description": "A free 10-area self-assessment tool for founders to get an instant scorecard of where their operations stand before booking a discovery call.",
              "provider": { "@id": "https://groundworkconsult.ca/#organization" }
            }
          }
        ]
      },
      "founder": {
        "@type": "Person",
        "name": "Jennifer",
        "jobTitle": "Founder, Groundwork Consult",
        "email": "jennifer@groundworkconsult.ca"
      },
      "sameAs": [
        "https://www.instagram.com/GroundWork_Consult"
      ]
    }
